<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SignalForge AI dashboard preview</title>
  <desc id="desc">Dark crypto narrative intelligence dashboard with AI scoring cards and trend analysis panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.52" stop-color="#10152a"/>
      <stop offset="1" stop-color="#170a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1010" cy="80" r="190" fill="#7c3aed" opacity="0.2" filter="url(#glow)"/>
  <circle cx="120" cy="570" r="210" fill="#22d3ee" opacity="0.14" filter="url(#glow)"/>
  <rect x="60" y="50" width="1080" height="575" rx="28" fill="#080b13" opacity="0.92" stroke="#233047"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="96" y="106" fill="#e5faff" font-size="34" font-weight="800">SignalForge AI</text>
    <text x="96" y="139" fill="#8ba4bf" font-size="17" font-weight="600">Narrative intelligence for crypto launches</text>
    <rect x="880" y="83" width="210" height="44" rx="22" fill="none" stroke="#22d3ee"/>
    <text x="925" y="111" fill="#dffcff" font-size="15" font-weight="800">Analyze Narrative</text>
    <g transform="translate(96 190)">
      <rect width="225" height="142" rx="18" fill="#101827" stroke="#233047"/>
      <text x="24" y="38" fill="#8ba4bf" font-size="14" font-weight="800">VIRALITY SCORE</text>
      <text x="24" y="104" fill="#ffffff" font-size="56" font-weight="900">92</text>
      <path d="M142 94 C162 52, 190 46, 205 30" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(345 190)">
      <rect width="225" height="142" rx="18" fill="#101827" stroke="#233047"/>
      <text x="24" y="38" fill="#8ba4bf" font-size="14" font-weight="800">ATTENTION SCORE</text>
      <text x="24" y="104" fill="#ffffff" font-size="56" font-weight="900">88</text>
      <circle cx="177" cy="74" r="38" fill="none" stroke="#8b5cf6" stroke-width="10"/>
    </g>
    <g transform="translate(594 190)">
      <rect width="225" height="142" rx="18" fill="#101827" stroke="#233047"/>
      <text x="24" y="38" fill="#8ba4bf" font-size="14" font-weight="800">SUSTAINABILITY</text>
      <text x="24" y="104" fill="#ffffff" font-size="56" font-weight="900">74</text>
      <rect x="146" y="46" width="56" height="62" rx="10" fill="url(#accent)" opacity="0.88"/>
    </g>
    <g transform="translate(843 190)">
      <rect width="225" height="142" rx="18" fill="#101827" stroke="#233047"/>
      <text x="24" y="38" fill="#8ba4bf" font-size="14" font-weight="800">MONETIZATION</text>
      <text x="24" y="104" fill="#ffffff" font-size="56" font-weight="900">81</text>
      <path d="M148 100 L174 46 L202 100" fill="none" stroke="#22d3ee" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="96" y="370" width="488" height="178" rx="20" fill="#101827" stroke="#233047"/>
    <text x="126" y="415" fill="#ffffff" font-size="22" font-weight="850">Narrative Summary</text>
    <text x="126" y="455" fill="#a8bad0" font-size="18">AI + ZK is moving from speculative hype</text>
    <text x="126" y="486" fill="#a8bad0" font-size="18">toward verifiable compute utility and</text>
    <text x="126" y="517" fill="#a8bad0" font-size="18">attention-driven market discovery.</text>
    <rect x="616" y="370" width="452" height="178" rx="20" fill="#101827" stroke="#233047"/>
    <text x="646" y="415" fill="#ffffff" font-size="22" font-weight="850">Market Psychology</text>
    <text x="646" y="455" fill="#a8bad0" font-size="18">Retail attention is clustering around AI,</text>
    <text x="646" y="486" fill="#a8bad0" font-size="18">ComputeFi, launch narratives, and early</text>
    <text x="646" y="517" fill="#a8bad0" font-size="18">asymmetric crypto sectors.</text>
    <rect x="96" y="578" width="174" height="28" rx="14" fill="#162235"/>
    <text x="120" y="598" fill="#22d3ee" font-size="13" font-weight="800">CREATOR MODE</text>
    <rect x="286" y="578" width="164" height="28" rx="14" fill="#201a39"/>
    <text x="311" y="598" fill="#c4b5fd" font-size="13" font-weight="800">TRADER MODE</text>
    <rect x="466" y="578" width="177" height="28" rx="14" fill="#162235"/>
    <text x="490" y="598" fill="#22d3ee" font-size="13" font-weight="800">RESEARCH MODE</text>
  </g>
</svg>
